<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#172522"><link rel="icon" href="data:,">
<title>寄り道の机 YORIMICHI DESK — prototype</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header><div><p class="eyebrow" data-measure>ORRERY QUBIT / <span data-prototype>仮素材の</span>机</p><h1 data-measure>寄り道の机</h1></div><p class="english" data-measure>YORIMICHI<br>DESK <span>↘</span></p></header>
  <section class="scene" aria-label="真上から見た机">
    <div class="desk" id="desk">
      <div class="surface" aria-hidden="true"><img id="bg1500" src="art/desk-1500.jpg" alt=""><img id="bg1700" src="art/desk-1700.jpg" alt=""><img id="bg1800" src="art/desk-1800.jpg" alt=""></div>
      <div id="night" aria-hidden="true"></div><div id="objects"></div>
    </div>
    <div class="desk-caption"><span id="timeCaption" data-measure>15:00 / まだ、寄り道の途中</span><span id="count" data-measure></span></div>
  </section>
  <section class="timeline" aria-label="机の時間">
    <label class="sr-only" for="time">机の時間</label>
    <input type="range" id="time" min="0" max="100" step="1" value="0" aria-valuetext="15:00">
    <div class="ticks"><span data-measure>15:00</span><span data-measure>夕方</span><span data-measure>帰りじたく</span></div>
  </section>
  <section id="reader" class="reader" aria-live="polite" aria-atomic="true">
    <div id="empty"><p class="reader-tag" data-measure>机の上の、気配に触れる。</p><p class="hint" data-measure>時間を進めると、置かれたものが現れます。</p></div>
    <div id="reading" hidden><p class="reader-tag" id="byline" data-measure></p><p id="line" data-measure></p></div>
  </section>
  <div class="actions"><p id="status" data-measure>音は、最初に触れたときから。</p><button id="leave" hidden data-measure>ひとつだけ置いて帰る <span aria-hidden="true">↗</span></button><button id="again" hidden data-measure>もう一度 <span aria-hidden="true">↺</span></button></div>
  <footer><span data-measure>触れて、残して、帰る。</span><span data-measure data-prototype>PROTOTYPE — 未公開</span></footer>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
