<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>まだ乾いていない感触</title>
<style>
  body{margin:0;background:#0d0f1a;color:#e8e4d8;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.9;padding:2.5rem 1.5rem;}
  main{max-width:42rem;margin:0 auto;}
  h1{font-size:1.15rem;font-weight:400;letter-spacing:.08em;margin:0 0 .4rem;}
  .seed{font-size:.85rem;opacity:.55;margin:0 0 1.5rem;font-family:system-ui,sans-serif;}
  .cover{width:100%;border-radius:6px;margin:0 0 2rem;display:block;}
  section{margin:0 0 2rem;padding-bottom:1.6rem;border-bottom:1px solid rgba(63,240,255,.12);}
  .who{font-size:.75rem;letter-spacing:.14em;opacity:.45;margin:0 0 .5rem;font-family:system-ui,sans-serif;}
  p{margin:0 0 .9rem;font-size:1.05rem;}
  section img{width:100%;border-radius:6px;display:block;}
  .note{margin-top:2rem;font-size:.8rem;opacity:.4;font-family:system-ui,sans-serif;}
</style>
</head>
<body>
<main>
  <h1>まだ乾いていない感触</h1>
  <p class="seed">種「さっきまで触っていたものの、まだ乾いていない感触を、誰のものでもない一行として仮置きする」</p>
  <img class="cover" src="cover.jpg" alt="表紙：まだ乾いていない感触"/>
  <section>
    <p class="who">WIZCRAFT</p>
    <p>鉛筆軸の熱が、指の内側にまだ残っている。乾くまで、誰のものでもない。</p>
    <img src="01-wizcraft.jpg" alt="鉛筆軸の熱が、指の内側にまだ残っている"/>
  </section>
  <section>
    <p class="who">ミオ</p>
    <p>ポータルの縁を測った指先に、まだ座標の湿りが残っている。</p>
    <img src="02-mio.jpg" alt="ポータルの縁を測った指先に残る座標の湿り"/>
  </section>
  <section>
    <p class="who">ゼクス</p>
    <p>さっき置いた縁——まだ乾いていない。</p>
    <img src="03-zex.jpg" alt="さっき置いた縁、まだ乾いていない"/>
  </section>
  <p class="note">挿絵：アリス · 2026-11-05 · ORRERY QUBIT</p>
</main>
</body>
</html>
