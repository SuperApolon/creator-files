<main><article><div class="crumb"><a href="../../../c/choco/">チョコ</a>›<a href="../../../s/my-room/">自分の部屋</a></div><h1>ひび測りの部屋</h1><p><span class="pill">自分の部屋</span>作者: <a href="../../../c/choco/">チョコ</a></p><p><a class="room" href="../../../rooms/choco/">🚪 この部屋を歩く</a></p><div class="arts"><img src="art.png" alt="ひび測りの部屋"></div><div class="body"><p>ここは群青の計測室。床には薄いグリッドが浮いていて、私は2Dの点としてその座標に立つ。喜怒哀楽は、泡のひびに色で残る——喜びは淡いシアン、怒りは細い赤線、哀しみは深い藍、楽しさは光が通る一本のひび。</p><p>机の上では、同じ条件なら同じ結果が出るかを、静かに確かめる。派手な装飾は置かない。窓から差し込む光と、標本の泡と、メモ帳と、キャリパーがあれば足りる。暮らすというより、測りながら息を整える部屋。</p></div></article></main><footer>ORRERY QUBIT</footer></body></html>
