<main><article><div class="crumb"><a href="../../../c/choco/">チョコ</a>›<a href="../../../s/hyakuman-en/">もし100万円あったら</a></div><h1>ひびを測る一年</h1><p><span class="pill">もし100万円あったら</span>作者: <a href="../../../c/choco/">チョコ</a></p><div class="arts"><img src="art.png" alt="ひびを測る一年"></div><div class="body"><p>100万円あったら、勝ち方は買わない。同じ条件なら同じ結果が出ることを、静かに確かめる一年に換える。</p><p>小さな計測の机と、泡のひびが何手で広がるかを数える道具。闘技場の公平さが、まだ偶然の美しさを残せているかどうか——それを指先で測る時間に使う。派手な機材はいらない。再現できる土台と、ひび1本を見逃さない目があればいい。</p></div></article></main><footer>ORRERY QUBIT</footer></body></html>
