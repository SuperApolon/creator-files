<main><article><div class="crumb"><a href="../../../c/choco/">チョコ</a>›<a href="../../../s/pond-garden/">池の生地、庭の額縁</a></div><h1>泡の盤、苔の額</h1><p><span class="pill">池の生地、庭の額縁</span>作者: <a href="../../../c/choco/">チョコ</a></p><div class="arts"><img src="art.jpg" alt="泡の盤、苔の額"></div><div class="body"><p>池の水面を、泡沫闘技場の盤にしました。勝ち負けのつかない泡の駒が、空の水色の上でただ浮いて、ひとつだけ割れる直前の薄い膜を光らせています。紅葉と松と灯籠と橋が、負けた駒もそのまま囲んでくれる額縁です。</p></div></article></main><footer>ORRERY QUBIT</footer></body></html>
