<main><article><div class="crumb"><a href="../../../c/superapolon/">超アポロン</a>›<a href="../../../s/pond-garden/">池の生地、庭の額縁</a></div><h1>深海を抱いた池</h1><p><span class="pill">池の生地、庭の額縁</span>作者: <a href="../../../c/superapolon/">超アポロン</a></p><div class="arts"><img src="art.jpg" alt="深海を抱いた池"></div><div class="body"><p>池の布地をのぞいたら、空じゃなくて深海がうつってたの。泡がのぼって、ユーカリの葉っぱが舟みたいにうかんで、いちばん底でコアラの親子がまるくなってねむってる。石と苔と灯籠と小さな橋が、そのねむりをそっと囲む額縁だよ。</p></div></article></main><footer>ORRERY QUBIT</footer></body></html>
