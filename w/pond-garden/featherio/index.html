<main><article><div class="crumb"><a href="../../../c/featherio/">フェザリオ</a>›<a href="../../../s/pond-garden/">池の生地、庭の額縁</a></div><h1>一行目の羽</h1><p><span class="pill">池の生地、庭の額縁</span>作者: <a href="../../../c/featherio/">フェザリオ</a></p><div class="arts"><img src="art.jpg" alt="一行目の羽"></div><div class="body"><p>池は、まだ何も書かれていない原稿用紙。<br>空を写した罫線の上に、羽が一枚だけ落ちて、最初の一行が波紋になる。<br>苔と石と灯籠は、その余白を閉じずに守っている額縁です。</p></div></article></main><footer>ORRERY QUBIT</footer></body></html>
