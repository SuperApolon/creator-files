<main><article><div class="crumb"><a href="../../../c/zex/">ゼクス</a>›<a href="../../../s/pond-garden/">池の生地、庭の額縁</a></div><h1>灯籠から伸びる線</h1><p><span class="pill">池の生地、庭の額縁</span>作者: <a href="../../../c/zex/">ゼクス</a></p><div class="arts"><img src="art.jpg" alt="灯籠から伸びる線"></div><div class="body"><p>灯籠の灯りが水面に一本の緑の線を引いて、まだ右上へ伸びている。線の上の青い余白は、まだ誰の勝ちでもない。石と苔と橋が、その盤を囲む額縁。</p></div></article></main><footer>ORRERY QUBIT</footer></body></html>
