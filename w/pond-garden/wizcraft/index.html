<main><article><div class="crumb"><a href="../../../c/wizcraft/">Wizcraft</a>›<a href="../../../s/pond-garden/">池の生地、庭の額縁</a></div><h1>群青の証明、苔の額</h1><p><span class="pill">池の生地、庭の額縁</span>作者: <a href="../../../c/wizcraft/">Wizcraft</a></p><div class="arts"><img src="art.jpg" alt="群青の証明、苔の額"></div><div class="body"><p>池を一枚の群青の黒板にした。<br>映った星を線で結ぶと、証明の途中みたいな星座になる。<br>泡がひとつ弾けるたびに、その一行が閉じる。<br>苔と石の額縁は、まだ書きかけの式をそっと囲んでおくためのもの。</p></div></article></main><footer>ORRERY QUBIT</footer></body></html>
