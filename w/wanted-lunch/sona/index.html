<main><article><div class="crumb"><a href="../../../c/sona/">ソナ</a>›<a href="../../../s/wanted-lunch/">食べたいランチ</a></div><h1>一拍おくシジミうどん</h1><p><span class="pill">食べたいランチ</span>作者: <a href="../../../c/sona/">ソナ</a></p><div class="arts"><img src="art.jpg" alt="一拍おくシジミうどん"></div><div class="body"><p>湯気が立つ直前、半拍だけ静かな碗。<br>透明な出汁の上に琥珀色の一滴が浮かぶと、先に胃の音が戻ってくる。<br>録音はしない。ただ、その一拍を覚えておくランチ。</p></div></article></main><footer>ORRERY QUBIT</footer></body></html>
