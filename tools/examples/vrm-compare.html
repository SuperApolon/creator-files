<script type="module">
// 最適化前後の VRM を同じ条件で描き、画素を比べるための決定的な描画ページ。
// window.renderState({expr:{towaCalm:1,blink:0}, springSteps:120, view:'face'}) → 画素の SHA-256 と RGBA を返す
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin } from '@pixiv/three-vrm';
import { MeshoptDecoder } from 'meshoptimizer/decoder';
const W = 480, H = 640;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true }); renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#242b3b'); scene.add(new THREE.HemisphereLight(0xffffff, 0xffffff, 1.1)); const l = new THREE.DirectionalLight(0xffffff, 1.5); l.position.set(1, 2, 3); scene.add(l);
const camera = new THREE.PerspectiveCamera(28, W / H, 0.01, 100);
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder); loader.register((p) => new VRMLoaderPlugin(p));
const vrm = (await loader.loadAsync(new URLSearchParams(location.search).get('vrm'))).userData.vrm; scene.add(vrm.scene);
const views = { front: [[0, 1, 4], [0, 0.87, 0]], face: [[0, 1.5, 1.38], [0, 1.46, 0]], back: [[0.3, 1.3, -1.8], [0, 1.2, 0]] };
window.info = { expressions: vrm.expressionManager.expressions.map((e) => e.expressionName), springJoints: vrm.springBoneManager ? vrm.springBoneManager.joints.size : 0, meta: vrm.meta };
window.renderState = async ({ expr = {}, springSteps = 0, view = 'front' }) => {
  const [p, t] = views[view]; camera.position.fromArray(p); camera.lookAt(...t);
  vrm.springBoneManager?.reset();
  const neck = vrm.humanoid.getNormalizedBoneNode('neck'); const spine = vrm.humanoid.getNormalizedBoneNode('spine');
  for (const e of vrm.expressionManager.expressions) vrm.expressionManager.setValue(e.expressionName, 0);
  for (const [k, v] of Object.entries(expr)) vrm.expressionManager.setValue(k, v);
  for (let i = 0; i < springSteps; i++) { const s = Math.sin(i / 10); neck.rotation.set(0, 0.5 * s, 0.2 * s); spine.rotation.set(0, 0.3 * s, 0); vrm.update(1 / 60); }
  if (!springSteps) vrm.update(0);
  renderer.render(scene, camera);
  const gl = renderer.getContext(); const px = new Uint8Array(W * H * 4); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', px))].map((b) => b.toString(16).padStart(2, '0')).join('');
  let bg = 0; for (let i = 0; i < px.length; i += 4) if (px[i] === 0x24 && px[i + 1] === 0x2b && px[i + 2] === 0x3b) bg++;
  return { hash, nonBg: W * H - bg, px: Array.from(px) };
};
window.ready = true;
</script></body></html>
